name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Lint, tipos, testes, build e e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: obras
          POSTGRES_PASSWORD: obras
          POSTGRES_DB: gestao_obras
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U obras"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://obras:obras@localhost:5432/gestao_obras
      AUTH_SECRET: somente-para-o-ci-nao-usar-em-producao
      # chave do cofre (certificado A1 cifrado no banco) só para o e2e; em produção vem do Secret Manager
      CHAVE_COFRE: Y2ktc29tZW50ZS10ZXN0ZS1uYW8tdXNhci1lbS1wcm8=
      AUTH_TRUST_HOST: "true"
      TZ: UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Auditoria de dependências (bloqueia vulnerabilidade crítica em produção)
        run: npm audit --omit=dev --audit-level=critical
      - name: Assinaturas do registro npm (pacote adulterado no caminho falha aqui)
        run: npm audit signatures
      - run: npx prisma generate
      - name: Migrations aplicam num banco vazio
        run: npx prisma migrate deploy
      - name: schema.prisma bate com as migrations
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build de produção (standalone)
        run: |
          npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
      - name: Dados para o e2e
        run: |
          npx tsx prisma/seed.ts
          npx tsx prisma/teste-fluxo.ts
      - run: npx playwright install --with-deps chromium
      - name: e2e contra o build de produção
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  docker:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build — app
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          load: true
          tags: gestao-obras:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build — migrator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          load: true
          tags: gestao-obras-migrator:ci
          cache-from: type=gha
      - name: Container do app sobe, roda sem root e responde
        run: |
          docker run -d --name app -p 8080:8080 \
            -e AUTH_SECRET=ci -e DATABASE_URL=postgresql://ci:ci@localhost:5432/ci gestao-obras:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/api/health && break; sleep 1; done
          curl -fsS localhost:8080/api/health
          test "$(docker exec app id -u)" != "0"
      - if: failure()
        run: docker logs app || true
      - name: Imagem de migrations tem o Prisma CLI
        run: docker run --rm gestao-obras-migrator:ci node_modules/.bin/prisma --version

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
