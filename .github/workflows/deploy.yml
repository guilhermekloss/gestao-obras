name: Deploy

# main → CI → imagens no Artifact Registry → migrations → nova revisão sem tráfego
# → smoke test na URL da revisão → 100% do tráfego. Se algo falhar antes do último
# passo, os usuários continuam na revisão anterior.
on:
  push:
    branches: [main]
    # Mudanças só de documentação não geram deploy.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/dependabot.yml"
      - ".github/rulesets/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy no Cloud Run
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      id-token: write # OIDC → Workload Identity Federation (sem chave de service account)
    env:
      APP: gestao-obras
      REGION: ${{ vars.GCP_REGION }}
      REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/gestao-obras
    steps:
      - name: Variáveis do GitHub configuradas
        run: |
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOYER_SA; do
            [ -n "${!v}" ] || { echo "::error::Cadastre a variável $v (ver docs/deploy-gcp.md)"; exit 1; }
          done
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Imagens já publicadas para este commit? (tags são imutáveis)
        id: existe
        run: |
          if gcloud artifacts docker images describe "$REGISTRY/app:$GITHUB_SHA" >/dev/null 2>&1 \
            && gcloud artifacts docker images describe "$REGISTRY/migrator:$GITHUB_SHA" >/dev/null 2>&1; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.existe.outputs.sim != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build e push — app
        if: steps.existe.outputs.sim != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: ${{ env.REGISTRY }}/app:${{ github.sha }}
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build e push — migrator
        if: steps.existe.outputs.sim != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: migrator
          push: true
          tags: ${{ env.REGISTRY }}/migrator:${{ github.sha }}
          build-args: DEPLOYMENT_VERSION=${{ github.sha }}
          cache-from: type=gha

      - name: Migrations (prisma migrate deploy)
        run: |
          gcloud run jobs update "$APP-migrate" --region "$REGION" --image "$REGISTRY/migrator:$GITHUB_SHA" --quiet
          gcloud run jobs execute "$APP-migrate" --region "$REGION" --wait

      - name: Nova revisão sem tráfego
        id: candidata
        run: |
          # Nome da revisão carrega o nº do deploy e o commit: gestao-obras-r12-1-63fe7f9
          gcloud run deploy "$APP" --region "$REGION" --image "$REGISTRY/app:$GITHUB_SHA" \
            --revision-suffix "r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}" \
            --no-traffic --tag candidata --quiet
          url=$(gcloud run services describe "$APP" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidata") | .url')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test na revisão nova
        env:
          URL: ${{ steps.candidata.outputs.url }}
        run: |
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$URL/api/health"
          curl -fsS -o /dev/null "$URL/login"

      - name: Promove para 100% do tráfego
        id: deploy
        run: |
          gcloud run services update-traffic "$APP" --region "$REGION" --to-latest --quiet
          echo "url=$(gcloud run services describe "$APP" --region "$REGION" --format='value(status.url)')" >> "$GITHUB_OUTPUT"

      - name: Resumo
        if: always()
        env:
          URL: ${{ steps.deploy.outputs.url }}
          SUCESSO: ${{ steps.deploy.outcome == 'success' }}
        run: |
          {
            if [ "$SUCESSO" = "true" ]; then
              echo "### ✅ Em produção"
              echo "- App: $URL"
              echo "- Commit: \`${GITHUB_SHA::7}\`"
              echo "- Revisão: \`$APP-r${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}\`"
            else
              echo "### ❌ Deploy não concluído — produção continua na versão anterior"
              echo "Veja o passo que falhou acima. Para voltar uma versão já publicada: Actions → Rollback."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
