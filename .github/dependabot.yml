version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias:
        update-types: [minor, patch]
    # Versões major quebram API (ex.: TypeScript 7, Vitest 5) e pedem migração
    # planejada: fazemos à mão, num PR próprio (o npm audit do CI segue barrando falhas críticas).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # Só atualizações dentro do Node 22 (o digest); trocar de major é decisão manual.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule:
      interval: monthly
